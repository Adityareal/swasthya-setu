name: Android APK

# Builds an installable debug APK and attaches it to the run as an artifact.
#
# There is no Android toolchain on the machine this repo was authored on, so this
# workflow is the ONLY place the Gradle build has ever run. Everything it needs is
# committed: the `android/` Gradle project, `capacitor.config.ts`, and the pinned
# Capacitor versions in `package.json`.
#
# No secret is referenced anywhere in this file, and that is deliberate rather
# than incidental. GEMINI_API_KEY lives only on the hosted web deployment that
# serves `app/api/`. An APK is a zip archive that anyone can unpack, so a key
# baked in here would be a key published. See `lib/api-base.ts`.

on:
  workflow_dispatch:
  push:
    branches: [master]

# Read-only. The workflow publishes nothing back to the repository; the APK
# leaves as a run artifact.
permissions:
  contents: read

# A second push supersedes an in-flight build rather than queueing behind it.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Capacitor 7's CLI declares `engines.node >= 20`.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ─────────────────────────────────────────────────────────────────────────
      # DO NOT "FIX" THIS BY DELETING IT.
      #
      # `output: 'export'` in next.config.ts and server route handlers in
      # `app/api/` are fundamentally incompatible: a static export has no server
      # to run a route handler on. The hosted WEB deployment needs those handlers
      # — they are where the Gemini key is used and the only reason the key never
      # reaches a client — so they stay in the repo. The APK does not need them
      # and cannot use them, so this build removes them.
      #
      # Measured on Next 15.5.25: the export currently SKIPS route handlers with
      # a warning rather than failing, so this step is not what makes the build
      # pass today. It is what stops a future Next release, which may well go back
      # to erroring, from turning that leniency into a broken release build. It
      # also makes the guarantee explicit: server code that is not in the tree
      # cannot end up in the APK.
      #
      # The deletion is confined to this runner's checkout. Nothing is pushed.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Strip server route handlers (incompatible with static export)
        run: rm -rf app/api

      # NEXT_PUBLIC_* is inlined into the client bundle at build time, so this has
      # to be set HERE and not at `cap sync` time. It is an origin, not a
      # credential, which is why a repository VARIABLE is the right home for it
      # rather than a secret.
      #
      # Unset falls back to '', which means same-origin. In an APK loaded from
      # https://localhost that resolves to nothing, so the AI calls fail fast and
      # every flow completes on its deterministic local fallback instead —
      # keyword triage and a locally composed summary, both visibly labelled. A
      # degraded APK, not a broken one, which is what makes this build useful
      # before any deployment exists.
      #
      # Set it under Settings → Secrets and variables → Actions → Variables, as
      # `API_BASE_URL`, to the HTTPS origin of the hosted deployment with no
      # trailing slash. HTTPS is required: capacitor.config.ts sets
      # allowMixedContent: false, so the WebView drops plain http.
      - name: Build static export
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL || '' }}
        run: npm run build

      - name: Verify the export produced a web bundle
        run: |
          test -f out/index.html
          test -f out/doctor/index.html
          test -f out/patient/index.html
          test -f out/asha/index.html
          test -f out/manifest.webmanifest
          echo "out/ contents:"
          ls -1 out

      # JDK 21, NOT 17. `android/app/capacitor.build.gradle` — generated by
      # Capacitor, marked do-not-edit — pins
      # `sourceCompatibility/targetCompatibility JavaVersion.VERSION_21`. On JDK 17
      # javac rejects that outright with "invalid source release: 21". Gradle
      # 8.11.1 and AGP 8.7.2, both from the Capacitor 7 template, run happily on
      # 21. If a future `cap sync` lowers that pin, this can come down with it.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Installs the command-line tools, accepts the SDK licences, and exports
      # ANDROID_HOME / ANDROID_SDK_ROOT. Gradle then downloads platform 35 and the
      # build tools itself on first use.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Copies out/ into android/app/src/main/assets/public and regenerates the
      # plugin wiring. Both are gitignored, so this step is not optional — it is
      # where the web app actually enters the Android project.
      - name: Sync web assets into the Android project
        run: npx cap sync android

      # Debug signing, on purpose. A debug APK is signed with the standard Android
      # debug key, which every SDK install generates, so it sideloads on any
      # device with "install from unknown sources" enabled. A release build needs a
      # keystore, that keystore needs to live in secrets, and losing it means
      # never being able to update the app — ceremony with no payoff for a
      # demonstration build. It is NOT Play-Store publishable, which is the one
      # thing this trade gives up.
      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Report APK size
        run: ls -lh android/app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: swasthya-setu-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
